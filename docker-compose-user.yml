version: '3.8'

networks:
  nas_core_net:
    external: true

services:
  user-plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: nas_plex
    restart: always
    networks:
      - nas_core_net
    ports:
      - "32400:32400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - VERSION=docker
    volumes:
      - ./plex_config:/config
      - ./nas_data:/data
