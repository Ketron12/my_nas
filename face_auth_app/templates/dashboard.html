<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🛸 Home Infrastructure Portal</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 50px 20px; text-align: center; position: relative; }
        .lang-switcher { position: absolute; top: 20px; right: 20px; }
        .lang-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .lang-btn:hover { background: #38bdf8; }
        .header-area { display: flex; justify-content: center; align-items: center; gap: 15px; max-width: 600px; margin: 0 auto 10px auto; }
        h1 { color: #38bdf8; margin: 0; font-size: 2.5rem; }
        .btn-monitor { background: #334155; border: 1px solid #475569; font-size: 1.5rem; padding: 10px; border-radius: 50%; cursor: pointer; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; color: white; }
        .btn-monitor:hover { background: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .subtitle { color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem; user-select: none; }
        #secretTrigger { cursor: default; }
        .grid { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto 50px auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 240px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-8px); border-color: #38bdf8; }
        .icon { font-size: 3.5rem; margin-bottom: 15px; }
        .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
        .desc { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; }
        .card-file { border-top: 4px solid #10b981; }
        .card-plex { border-top: 4px solid #f59e0b; }
        .card-ai { border-top: 4px solid #a855f7; }
        .card-immich { border-top: 4px solid #ef4444; }
        .shutdown-area { margin-top: 60px; border-top: 1px solid #334155; padding-top: 30px; }
        .btn-shutdown { background: #e74c3c; color: white; font-size: 15px; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; border: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; border: 1px solid #475569; border-radius: 20px; width: 400px; padding: 35px; text-align: center; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        .stat-group { margin: 20px 0; text-align: left; }
        .stat-label { font-size: 1.1rem; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .bar-bg { background: #334155; height: 16px; border-radius: 8px; width: 100%; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.5s; }
        .cpu-fill { background: #38bdf8; }
        .ram-fill { background: #ec4899; }
        .details-text { font-size: 0.9rem; color: #64748b; text-align: right; margin-top: 5px; }
    </style>
</head>
<body>

<div class="lang-switcher"><button id="toggleLang" class="lang-btn">EN</button></div>

<div class="header-area">
    <h1 id="dashTitle">🛸 내 미니 PC 개인 홈 서버</h1>
    <button id="monitorBtn" class="btn-monitor">📊</button>
</div>
<div class="subtitle"><span id="secretTrigger">🛸</span> <span id="dashSubtitle">보안 게이트웨이가 인증한 안전한 가상 공간입니다.</span></div>

<div class="grid">
    <a href="/file" target="_blank" class="card card-file"><div class="icon">📂</div><div id="c1Title" class="title">개인 클라우드</div><div id="c1Desc" class="desc">웹 파일 탐색기입니다. 자유롭게 파일을 관리하세요.</div></a>
    <a href="http://localhost:32400/web" target="_blank" class="card card-plex"><div class="icon">🎬</div><div id="c2Title" class="title">플렉스 미디어</div><div id="c2Desc" class="desc">영화 및 미디어를 집안 어디서든 스트리밍합니다.</div></a>
    <a href="http://localhost:3000" target="_blank" class="card card-ai"><div class="icon">🤖</div><div id="c3Title" class="title">로컬 AI 챗봇</div><div id="c3Desc" class="desc">외부 유출 없는 강력한 내 개인 전용 AI와 대화합니다.</div></a>
    <a href="http://localhost:2283" target="_blank" class="card card-immich"><div class="icon">📸</div><div id="c4Title" class="title">사진 클라우드</div><div id="c4Desc" class="desc">모바일 백그라운드 사진 자동 백업 구글 포토입니다.</div></a>
</div>

<div id="monitorModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <div class="stat-group">
            <div class="stat-label"><span id="mCpu">CPU 사용량</span> <span id="cpuText">0%</span></div>
            <div class="bar-bg"><div id="cpuBar" class="bar-fill cpu-fill"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span id="mRam">RAM 사용량</span> <span id="ramText">0%</span></div>
            <div class="bar-bg"><div id="ramBar" class="bar-fill ram-fill"></div></div>
            <div id="ramDetails" class="details-text">0 GB 사용 중</div>
        </div>
    </div>
</div>
<div class="shutdown-area"><button id="shutdownBtn" class="btn-shutdown">🔴 미니 PC 본체 전원 차단</button></div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
