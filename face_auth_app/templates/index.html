<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 로컬 페이스 게이트웨이</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f6f9; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 400px; }
        video { width: 100%; border-radius: 8px; background: #2c3e50; transform: scaleX(-1); margin-bottom: 15px; }
        button { font-size: 16px; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-verify { background: #3498db; color: white; font-weight: bold; }
        #status { font-weight: bold; margin: 15px 0; color: #7f8c8d; }
        #result { margin-top: 25px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; }
        .match { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        #passwordArea { display: none; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; }
        input { width: 90%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; text-align: center; margin-bottom: 10px; }
        .btn-pass { background: #2ecc71; color: white; }
        canvas { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>📸 AI Face ID 게이트웨이</h2>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status">카메라 조율 중...</div>
    <button id="verifyBtn" class="btn-verify">👤 Face ID 인증하기</button>
    <div id="result"></div>
    <div id="passwordArea">
        <input type="password" id="backupPassword" placeholder="2차 비밀번호 입력">
        <button id="passBtn" class="btn-pass">확인 및 로그인</button>
    </div>
</div>
<script>
    const video = document.getElementById('webcam'), canvas = document.getElementById('canvas'), verifyBtn = document.getElementById('verifyBtn'), statusDiv = document.getElementById('status'), resultDiv = document.getElementById('result'), passwordArea = document.getElementById('passwordArea'), passBtn = document.getElementById('passBtn');
    
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream; statusDiv.innerText = "정면을 바라본 채 버튼을 누르세요";
        } catch { statusDiv.innerText = "❌ 카메라 장치를 로드할 수 없습니다. (HTTPS 필수)"; verifyBtn.disabled = true; }
    }
    initCamera();

    verifyBtn.onclick = async () => {
        statusDiv.innerText = "🤖 AI 안면 특징점 분석 중..."; resultDiv.style.display = 'none';
        const context = canvas.getContext('2d'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        context.translate(canvas.width, 0); context.scale(-1, 1);
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData(); formData.append('image', blob, 'auth_attempt.jpg');
            try {
                const response = await fetch('/verify', { method: 'POST', body: formData });
                const data = await response.json(); resultDiv.style.display = 'block';
                if (data.success && data.is_match) {
                    resultDiv.className = "match"; resultDiv.innerHTML = "✅ Face ID 성공! 시스템을 개방합니다.";
                    setTimeout(() => { window.location.href = "/dashboard"; }, 1500);
                } else {
                    resultDiv.className = "fail"; resultDiv.innerHTML = "❌ 일치하지 않는 사용자입니다.";
                    passwordArea.style.display = 'block'; statusDiv.innerText = "백업 암호를 입력해 주세요.";
                }
            } catch { alert("서버 통신 실패"); }
        }, 'image/jpeg');
    };

    passBtn.onclick = async () => {
        const passwordInput = document.getElementById('backupPassword').value;
        try {
            const response = await fetch('/verify-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: passwordInput }) });
            if (response.ok) { resultDiv.className = "match"; resultDiv.innerHTML = "✅ 백업 패스워드 인증 완료!"; setTimeout(() => { window.location.href = "/dashboard"; }, 1500); }
            else { alert("비밀번호 불일치"); }
        } catch { alert("서버 통신 실패"); }
    };
</script>
</body>
</html>
