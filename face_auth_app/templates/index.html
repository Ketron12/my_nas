<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Local Face Gateway</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f6f9; position: relative; }
        .lang-switcher { position: absolute; top: 20px; right: 20px; }
        .lang-btn { background: #334155; color: white; border: 1px solid #475569; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .lang-btn:hover { background: #38bdf8; border-color: #38bdf8; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 400px; margin-top: 20px; }
        video { width: 100%; border-radius: 8px; background: #2c3e50; transform: scaleX(-1); margin-bottom: 15px; }
        button { font-size: 16px; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-verify { background: #3498db; color: white; }
        .btn-register { background: #e67e22; color: white; }
        #status { font-weight: bold; margin: 15px 0; color: #7f8c8d; font-size: 14px; }
        #result { margin-top: 25px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; }
        .match { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .setup-input-area { background: #fff3cd; padding: 15px; border-radius: 6px; border: 1px solid #ffeeba; margin-bottom: 15px; color: #856404; text-align: left; font-size: 14px; }
        #passwordArea { display: none; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; }
        input { width: 90%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; text-align: center; margin-bottom: 10px; }
        .btn-pass { background: #2ecc71; color: white; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button id="toggleLang" class="lang-btn">EN</button>
</div>

<div class="container">
    <h2 id="mainTitle">📸 AI Face ID 게이트웨이</h2>
    
    <div id="setupAlert" class="setup-input-area" style="display: none;">
        <span id="setupAlertText">🔒 <b>서버 초기 셋업 모드</b><br>auto_start.sh 에서 설정한 마스터 비밀번호를 입력해야 내 얼굴을 주인으로 등록할 수 있습니다.</span>
        <input type="password" id="setupPassword" placeholder="초기 셋업 비밀번호 입력" style="margin-top:10px; width:95%;">
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status">카메라 조율 중...</div>
    
    <button id="actionBtn" class="btn-verify">Face ID 인증하기</button>
    
    <div id="result"></div>
    <div id="passwordArea">
        <input type="password" id="backupPassword" placeholder="2차 비밀번호 입력">
        <button id="passBtn" class="btn-pass">확인 및 로그인</button>
    </div>
</div>

<div id="nas-config" data-registered="{{ is_registered | tojson }}" style="display: none;"></div>

<script>
    // 💡 독립된 자바스크립트(auth.js) 파일이 읽어갈 수 있도록 안전한 브라우저 메모리(window) 공간에 주입합니다.
    const configElem = document.getElementById('nas-config');
    window.IS_REGISTERED = JSON.parse(configElem.getAttribute('data-registered'));
</script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
