version: '3.8'

networks:
  nas_core_net:
    external: true

services:
  # 🌐 [추가] 외부 접속 및 HTTPS 암호화를 총괄하는 Nginx Proxy Manager
  infra-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nas_proxy
    restart: always
    networks:
      - nas_core_net
    ports:
      # 💡 윈도우 시스템 포트(80, 443)와 충돌을 피하기 위해 왼쪽(외부 포트)만 바꿉니다.
      - '8080:80'   # HTTP 접속은 이제 8080 포트로
      - '8443:443'  # HTTPS 접속은 이제 8443 포트로
      - '81:81'     # 프록시 관리 화면은 그대로 81
      # 리눅스라면 아래 포트 설정을 사용하셔도 됩니다.
      #- '80:80'   # 일반 HTTP 웹 접속 통로
      #- '443:443' # 🔒 마이크 권한 획득에 필수적인 HTTPS 보안 접속 통로
      #- '81:81'   # Nginx 프록시 자체 관리자 웹 화면 포트
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt

  # 📂 초경량 웹 파일 탐색기 (Filebrowser)
  infra-filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: nas_filebrowser
    restart: always
    networks:
      - nas_core_net
    # 💡 Nginx 프록시가 내부 네트워크망을 통해 연결해 줄 것이므로 외부 포트 노출(ports:)은 제외합니다.
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - ./nas_data:/srv
      - ./filebrowser.db:/database.db

  # 📊 도커 관리 대시보드 (Portainer)
  infra-portainer:
    image: portainer/portainer-ce:latest
    container_name: nas_portainer
    restart: always
    networks:
      - nas_core_net
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    environment:
      - PORTAINER_NO_SETUP_TOKEN=1
