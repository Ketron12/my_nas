networks:
  nas_core_net:
    external: true

services:
  # 외부 접속 및 HTTPS 암호화를 총괄하는 Nginx Proxy Manager
  infra-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nas_proxy
    restart: always
    networks:
      - nas_core_net
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt

  # 초경량 웹 파일 탐색기 (Filebrowser)
  infra-filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: nas_filebrowser
    restart: always
    networks:
      - nas_core_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - ./nas_data:/srv
      - ./filebrowser.db:/filebrowser.db

  # 도커 관리 대시보드 (Portainer)
  infra-portainer:
    image: portainer/portainer-ce:latest
    container_name: nas_portainer
    restart: always
    networks:
      - nas_core_net
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    environment:
      - PORTAINER_NO_SETUP_TOKEN=1

    # 📂 docker-compose-infra.yml 내부 DuckDNS 서비스 부분
  infra-duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: nas_duckdns
    restart: always
    networks:
      - nas_core_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      # 💡 내 서브도메인 이름 기입 (뒤에 .duckdns.org는 제외)
      - SUBDOMAINS=ketron-nas
      # 💡 [보안 강화] 소스 코드에서 토큰을 지우고, .env에서 동적으로 주입받습니다.
      - TOKEN=${DUCKDNS_TOKEN}
