version: '3.8'

networks:
  nas_core_net:
    external: true

services:
  voice-auth-service:
    image: pytorch/pytorch:latest
    container_name: voice_auth_ai
    restart: always
    networks:
      - nas_core_net
    ports:
      - "5000:5000"
    volumes:
      - ./voice_auth_app:/app
      - ./voice_data:/app/voice_data
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python app.py"